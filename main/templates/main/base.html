{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sourav P | Python Developer
        {% endblock %}
    </title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">

    <!-- Website Favicon -->
    <link rel="icon" type="image/png" href="{% static 'main/images/favicon.png' %}">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="nav-container">

                <!-- Brand -->
                <a href="{% url 'home' %}" class="nav-brand">
                    SOURAV <span>&nbsp;P</span>
                </a>


                <!-- Navigation -->
                <div class="nav-links">

                    <a href="{% url 'home' %}#home" class="nav-link">
                        Home
                    </a>

                    <a href="{% url 'home' %}#about" class="nav-link">
                        About
                    </a>

                    <a href="{% url 'home' %}#skills" class="nav-link">
                        Skills
                    </a>

                    <a href="{% url 'home' %}#experience" class="nav-link">
                        Experience
                    </a>

                    <a href="{% url 'home' %}#projects" class="nav-link">
                        Projects
                    </a>

                    <a href="{% url 'home' %}#contact" class="nav-link">
                        Contact
                    </a>

                    <a href="{% url 'home' %}#contact" class="nav-contact">
                        Let's Talk
                        <span>↗</span>
                    </a>

                </div>


                <!-- Mobile Menu -->
                <button
                    class="menu-toggle"
                    aria-label="Toggle navigation"
                    aria-expanded="false"
                >

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>

                </button>

            </div>

        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer class="site-footer">

        <div class="footer-main">

            <div class="footer-signature">

                <p>
                    Designed & Developed by <span class="footer-name">Sourav P</span>
                </p>

                <span>
                    Built with Python and Django
                </span>

            </div>

            <div class="footer-code-icon">
                <a href="https://github.com/sourav-srv916/django-portfolio"
                    class="footer-code-icon"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="View source code on GitHub">

                    <i class="fa-solid fa-code"></i>
                </a>
            </div>

        </div>

        <div class="footer-bottom">

            <p>
                © <span id="current-year"></span> All rights reserved.
            </p>

            <a href="#home" class="footer-back-to-top"
            aria-label="Back to top">
                <i class="fa-solid fa-arrow-up"></i>
            </a>

        </div>

    </footer>

    <script src="{% static 'main/js/script.js' %}"></script>

</body>

</html>
